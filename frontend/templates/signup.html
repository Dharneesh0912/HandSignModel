<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up — SignSpeak</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}"/>
</head>
<body class="auth-body">
  <div class="auth-container" id="authCard">

    <!-- ============ LEFT PANEL ============ -->
    <div class="auth-left">
      <div class="brand">
        <div class="brand-icon">
          <img src="{{ url_for('static', filename='img/logo-icon-128.png') }}" alt="Sign Translator"/>
        </div>
        <div class="brand-name">Sign Translator</div>
      </div>
      <div class="auth-left-content">
        <h1>Join SignSpeak</h1>
        <p>Create your free account and start converting signs to speech in minutes.</p>

        <div class="auth-features">
          <div class="auth-feature">
            <span class="check">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="5 12 10 17 19 7"/>
              </svg>
            </span>
            <span>Free forever — no credit card</span>
          </div>
          <div class="auth-feature">
            <span class="check">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="5 12 10 17 19 7"/>
              </svg>
            </span>
            <span>Save your sentence history</span>
          </div>
          <div class="auth-feature">
            <span class="check">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="5 12 10 17 19 7"/>
              </svg>
            </span>
            <span>Works on any modern browser</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ============ RIGHT PANEL ============ -->
    <div class="auth-right">
      <h2>Create account</h2>
      <p class="auth-subtitle">Get started in less than a minute.</p>

      <form id="signupForm">
        <div class="field">
          <label for="full_name">Full name</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>
              </svg>
            </span>
            <input type="text" id="full_name" name="full_name" placeholder="John Doe" required autocomplete="name">
          </div>
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24">
                <rect x="3" y="5" width="18" height="14" rx="2"/>
                <path d="M3 7l9 6 9-6"/>
              </svg>
            </span>
            <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24">
                <rect x="4" y="10" width="16" height="11" rx="2"/>
                <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
                <circle cx="12" cy="15.5" r="1.2" fill="currentColor" stroke="none"/>
              </svg>
            </span>
            <input type="password" id="password" name="password" placeholder="Minimum 6 characters" required minlength="6" autocomplete="new-password">
            <button type="button" class="toggle-pw" onclick="togglePassword('password', this)" aria-label="Show password">
              <svg viewBox="0 0 24 24">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="submitBtn">Create Account</button>
        <p class="switch">Already have an account? <a href="/login">Login</a></p>
        <p id="msg" class="msg"></p>
      </form>
    </div>

  </div>

  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
  <script src="{{ url_for('static', filename='js/ai-background.js') }}"></script>
  <script>
    // Cursor glow on card
    (function () {
      const card = document.getElementById('authCard');
      if (card) {
        card.addEventListener('mousemove', (e) => {
          const rect = card.getBoundingClientRect();
          card.style.setProperty('--mx', (e.clientX - rect.left) + 'px');
          card.style.setProperty('--my', (e.clientY - rect.top) + 'px');
        });
      }
    })();

    // Password visibility toggle with SVG swap
    function togglePassword(id, btn) {
      const input = document.getElementById(id);
      if (!input) return;
      const isPw = input.type === 'password';
      input.type = isPw ? 'text' : 'password';

      if (isPw) {
        btn.innerHTML = `
          <svg viewBox="0 0 24 24">
            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.77 20.77 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a20.77 20.77 0 0 1-3.16 4.19"/>
            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>`;
      } else {
        btn.innerHTML = `
          <svg viewBox="0 0 24 24">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>`;
      }
    }
  </script>
</body>
</html>
